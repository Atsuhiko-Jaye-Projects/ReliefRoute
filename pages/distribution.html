<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Track relief goods distribution for Mogpog.">
  <title>Distribution · ReliefRoute</title>
  <link rel="icon" href="../assets/images/favicon.svg">
  <link rel="stylesheet" href="../assets/vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="../assets/vendor/bootstrap-icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body data-page="distribution">
  <p id="rr-boot" class="p-4 text-secondary">Loading ReliefRoute…</p>
  <main id="page-root" class="rr-content" hidden>
    <div class="d-flex flex-wrap justify-content-between align-items-start gap-3 mb-3">
      <div>
        <h2 class="h4 mb-1">Relief distribution</h2>
        <p id="scopeNote" class="text-secondary mb-0"></p>
      </div>
      <div class="d-flex flex-wrap gap-2">
        <button type="button" class="btn btn-outline-secondary" id="exportJsonBtn">Export JSON</button>
        <button type="button" class="btn btn-outline-secondary" id="exportCsvBtn">Export CSV</button>
        <button type="button" class="btn btn-outline-secondary" id="importJsonBtn">Import JSON</button>
        <input id="importJsonInput" type="file" accept="application/json,.json" hidden>
        <button type="button" class="btn btn-rr" id="addBtn">New distribution</button>
      </div>
    </div>
    <form class="rr-card p-3 mb-3" id="filterForm" role="search" aria-label="Filter distributions">
      <div class="row g-2 align-items-end">
        <div class="col-12 col-md-5">
          <label class="form-label" for="filterQuery">Search</label>
          <input class="form-control" id="filterQuery" name="q" type="search" placeholder="Reference, barangay, or item">
        </div>
        <div class="col-6 col-md-3">
          <label class="form-label" for="filterStatus">Status</label>
          <select class="form-select" id="filterStatus" name="status"></select>
        </div>
        <div class="col-6 col-md-2" id="barangayFilterWrap">
          <label class="form-label" for="filterBarangay">Barangay</label>
          <select class="form-select" id="filterBarangay" name="barangay"></select>
        </div>
        <div class="col-12 col-md-2">
          <button class="btn btn-outline-secondary w-100" type="button" id="resetFilters">Reset</button>
        </div>
      </div>
    </form>
    <section class="rr-card p-3">
      <div class="d-flex justify-content-between"><h3 class="h6">Records</h3><p id="resultCount" class="small text-secondary" aria-live="polite"></p></div>
      <div class="table-responsive">
        <table class="table align-middle mb-0">
          <caption class="visually-hidden">Distribution records</caption>
          <thead>
            <tr><th>Reference</th><th>Barangay</th><th>Date</th><th>Goods</th><th>Personnel</th><th class="text-end">Families served</th><th>Status</th><th>Actions</th></tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
      <div id="pager"></div>
    </section>
    <div class="modal fade" id="formModal" tabindex="-1" aria-labelledby="distributionModalTitle" aria-hidden="true">
      <div class="modal-dialog modal-lg modal-dialog-scrollable modal-fullscreen-sm-down">
        <div class="modal-content">
          <form id="recordForm" novalidate>
            <div class="modal-header">
              <h2 class="modal-title h5" id="distributionModalTitle">New distribution</h2>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
              <div id="formAlert" class="alert alert-danger" role="alert" tabindex="-1" hidden></div>
              <div class="row g-3">
                <div class="col-md-6">
                  <label class="form-label" for="deliveryReference">Delivery reference</label>
                  <input class="form-control" id="deliveryReference" name="reference" readonly>
                </div>
                <div class="col-md-6">
                  <label class="form-label" for="distributionBarangay">Destination barangay</label>
                  <select class="form-select" id="distributionBarangay" name="barangay"></select>
                </div>
                <div class="col-md-4">
                  <label class="form-label" for="distributionDate">Date</label>
                  <input class="form-control" id="distributionDate" name="date" type="date">
                </div>
                <div class="col-md-4">
                  <label class="form-label" for="distributionStatus">Status</label>
                  <select class="form-select" id="distributionStatus" name="status"></select>
                </div>
                <div class="col-md-4">
                  <label class="form-label" for="familiesServed">Families served</label>
                  <input class="form-control" id="familiesServed" name="familiesServed" type="number" min="0" max="20000" step="1" inputmode="numeric">
                </div>
                <div class="col-12">
                  <label class="form-label" for="distributionPersonnel">Assigned personnel</label>
                  <input class="form-control" id="distributionPersonnel" name="personnel" maxlength="120">
                </div>
                <div class="col-md-6">
                  <label class="form-label" for="distributionRequest">Linked request</label>
                  <select class="form-select" id="distributionRequest" name="requestId"></select>
                </div>
                <div class="col-md-6">
                  <label class="form-label" for="distributionRoute">Linked route</label>
                  <select class="form-select" id="distributionRoute" name="routeId"></select>
                </div>
                <div class="col-12">
                  <fieldset>
                    <legend class="form-label h6">Relief goods</legend>
                    <div id="goodsLines"></div>
                    <button type="button" class="btn btn-outline-secondary btn-sm" id="addGoodsLine">Add item</button>
                  </fieldset>
                </div>
                <div class="col-12">
                  <label class="form-label" for="distributionRemarks">Remarks</label>
                  <textarea class="form-control" id="distributionRemarks" name="remarks" rows="3" maxlength="500"></textarea>
                </div>
                <div class="col-12" id="deductWrap">
                  <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="deductInventory" name="deductInventory">
                    <label class="form-check-label" for="deductInventory">Subtract these quantities from inventory when the status is Delivered or Partially Delivered</label>
                  </div>
                </div>
                <div class="col-12">
                  <p id="deductNote" class="small text-secondary mb-0" hidden></p>
                </div>
              </div>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
              <button type="submit" class="btn btn-rr">Save distribution</button>
            </div>
          </form>
        </div>
      </div>
    </div>
    <div class="modal fade" id="viewModal" tabindex="-1" aria-labelledby="viewTitle" aria-hidden="true">
      <div class="modal-dialog modal-lg modal-dialog-scrollable modal-fullscreen-sm-down">
        <div class="modal-content">
          <div class="modal-header">
            <h2 class="modal-title h5" id="viewTitle">Distribution</h2>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body" id="viewBody"></div>
        </div>
      </div>
    </div>
  </main>
  <script src="../assets/vendor/bootstrap/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/storage.js"></script>
  <script src="../assets/js/app.js"></script>
  <script src="../assets/js/distribution.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      RR.boot(function (user) { DistributionPage.init(user); });
    });
  </script>
</body>
</html>
