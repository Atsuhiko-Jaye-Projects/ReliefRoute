<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Monitor sample priority areas for relief coordination in Mogpog.">
  <title>Priority Areas · ReliefRoute</title>
  <link rel="icon" href="../assets/images/favicon.svg">
  <link rel="stylesheet" href="../assets/vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="../assets/vendor/bootstrap-icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body data-page="areas">
  <p id="rr-boot" class="p-4 text-secondary">Loading ReliefRoute…</p>
  <main id="page-root" class="rr-content" hidden>
    <div class="d-flex flex-wrap justify-content-between align-items-start gap-3 mb-3">
      <div>
        <h2 class="h4 mb-1">Areas that need attention</h2>
        <p id="scopeNote" class="text-secondary mb-0"></p>
      </div>
      <div class="d-flex flex-wrap gap-2">
        <button type="button" class="btn btn-outline-secondary" id="exportJsonBtn">Export JSON</button>
        <button type="button" class="btn btn-outline-secondary" id="exportCsvBtn">Export CSV</button>
        <button type="button" class="btn btn-outline-secondary" id="importJsonBtn">Import JSON</button>
        <input id="importJsonInput" type="file" accept="application/json,.json" hidden>
        <button type="button" class="btn btn-rr" id="addBtn">New area</button>
      </div>
    </div>
    <form class="rr-card p-3 mb-3" id="filterForm" role="search" aria-label="Filter priority areas">
      <div class="row g-2 align-items-end">
        <div class="col-12 col-md-4">
          <label class="form-label" for="filterQuery">Search</label>
          <input class="form-control" id="filterQuery" name="q" type="search" placeholder="Area, barangay, or need">
        </div>
        <div class="col-6 col-md-2">
          <label class="form-label" for="filterStatus">Status</label>
          <select class="form-select" id="filterStatus" name="status"></select>
        </div>
        <div class="col-6 col-md-2">
          <label class="form-label" for="filterPriority">Priority</label>
          <select class="form-select" id="filterPriority" name="priority"></select>
        </div>
        <div class="col-12 col-md-2" id="barangayFilterWrap">
          <label class="form-label" for="filterBarangay">Barangay</label>
          <select class="form-select" id="filterBarangay" name="barangay"></select>
        </div>
        <div class="col-12 col-md-2">
          <button class="btn btn-outline-secondary w-100" type="button" id="resetFilters">Reset</button>
        </div>
      </div>
    </form>
    <section class="rr-card p-3">
      <div class="d-flex justify-content-between"><h3 class="h6">Records</h3><p id="resultCount" class="small text-secondary" aria-live="polite"></p></div>
      <div class="table-responsive">
        <table class="table align-middle mb-0">
          <caption class="visually-hidden">Priority areas</caption>
          <thead>
            <tr><th>Area</th><th>Barangay</th><th>Location</th><th class="text-end">Families</th><th>Assistance</th><th>Priority</th><th>Status</th><th>Actions</th></tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
      <div id="pager"></div>
    </section>
    <div class="modal fade" id="formModal" tabindex="-1" aria-labelledby="areaModalTitle" aria-hidden="true">
      <div class="modal-dialog modal-lg modal-dialog-scrollable modal-fullscreen-sm-down">
        <div class="modal-content">
          <form id="recordForm" novalidate>
            <div class="modal-header">
              <h2 class="modal-title h5" id="areaModalTitle">New priority area</h2>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
              <div id="formAlert" class="alert alert-danger" role="alert" tabindex="-1" hidden></div>
              <div class="row g-3">
                <div class="col-md-6">
                  <label class="form-label" for="areaBarangay">Barangay</label>
                  <select class="form-select" id="areaBarangay" name="barangay"></select>
                </div>
                <div class="col-md-6">
                  <label class="form-label" for="areaLocation">Location or address</label>
                  <input class="form-control" id="areaLocation" name="location" maxlength="160">
                </div>
                <div class="col-md-4">
                  <label class="form-label" for="areaFamilies">Affected families</label>
                  <input class="form-control" id="areaFamilies" name="affectedFamilies" type="number" min="1" max="20000" step="1" inputmode="numeric">
                </div>
                <div class="col-md-4">
                  <label class="form-label" for="areaPriority">Priority</label>
                  <select class="form-select" id="areaPriority" name="priority"></select>
                </div>
                <div class="col-md-4">
                  <label class="form-label" for="areaStatus">Status</label>
                  <select class="form-select" id="areaStatus" name="status"></select>
                </div>
                <div class="col-12">
                  <label class="form-label" for="areaNeed">Assistance needed</label>
                  <input class="form-control" id="areaNeed" name="assistanceNeeded" maxlength="160">
                </div>
                <div class="col-12">
                  <label class="form-label" for="areaDescription">Situation</label>
                  <textarea class="form-control" id="areaDescription" name="description" rows="4" maxlength="1000"></textarea>
                </div>
                <div class="col-12">
                  <label class="form-label" for="areaRequest">Linked relief request</label>
                  <select class="form-select" id="areaRequest" name="relatedRequestId"></select>
                  <p class="form-text">The last updated date is set to today when you save. Priority here is a coordination label, not an official assessment.</p>
                </div>
              </div>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
              <button type="submit" class="btn btn-rr">Save area</button>
            </div>
          </form>
        </div>
      </div>
    </div>
    <div class="modal fade" id="viewModal" tabindex="-1" aria-labelledby="viewTitle" aria-hidden="true">
      <div class="modal-dialog modal-lg modal-dialog-scrollable modal-fullscreen-sm-down">
        <div class="modal-content">
          <div class="modal-header">
            <h2 class="modal-title h5" id="viewTitle">Area</h2>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body" id="viewBody"></div>
        </div>
      </div>
    </div>
  </main>
  <script src="../assets/vendor/bootstrap/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/storage.js"></script>
  <script src="../assets/js/app.js"></script>
  <script src="../assets/js/priority-areas.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      RR.boot(function (user) { PriorityAreas.init(user); });
    });
  </script>
</body>
</html>
